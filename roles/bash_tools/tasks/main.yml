---
- name: Update package cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Upgrade system packages
  apt:
    upgrade: dist
    autoremove: yes
    autoclean: yes

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base.packages }}"
    state: latest

- name: Install lazygit
  roles:
    - role: pluggero.lazygit