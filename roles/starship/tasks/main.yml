---
- name: Include OS-specific variables
  ansible.builtin.include_vars:
    file: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_os_family }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_distribution }}_{{ ansible_distribution_version }}.yml"
      skip: true

- name: Install Starship dependencies
  ansible.builtin.package:
    name: "{{ starship_dependencies }}"
    state: present
  when: starship_install_dependencies | bool

- name: Check if Starship is already installed
  ansible.builtin.command:
    cmd: which starship && starship --version
  register: starship_check
  changed_when: false
  failed_when: false

- name: Install Starship via official script
  when:
    - starship_install_method == "script"
    - starship_check is failed or starship_force_reinstall | default(false) | bool
  block:
    - name: Download and install Starship
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          curl -fsSL https://starship.rs/install.sh | sh -s -- --yes
        executable: /bin/bash
      args:
        creates: /usr/local/bin/starship

- name: Install Starship via package manager
  ansible.builtin.package:
    name: starship
    state: present
  when: starship_install_method == "package"

- name: Install Starship via Cargo
  when:
    - starship_install_method == "cargo"
    - starship_check is failed
  ansible.builtin.command:
    cmd: "{{ rust_install_path | default(ansible_user_dir + '/.cargo') }}/bin/cargo install starship --locked"
    creates: "{{ ansible_user_dir }}/.cargo/bin/starship"
  environment:
    PATH: "{{ rust_install_path | default(ansible_user_dir + '/.cargo') }}/bin:{{ ansible_env.PATH }}"
    CARGO_HOME: "{{ rust_install_path | default(ansible_user_dir + '/.cargo') }}"

- name: Create starship config directory
  ansible.builtin.file:
    path: "{{ starship_config_dir }}"
    state: directory
    mode: '0755'

- name: Deploy starship configuration
  ansible.builtin.template:
    src: starship.toml.j2
    dest: "{{ starship_config_file }}"
    mode: '0644'
  when: starship_custom_config | bool

- name: Configure shell integration
  ansible.builtin.blockinfile:
    path: "{{ ansible_user_dir }}/.{{ item }}rc"
    block: |
      # Starship prompt - Managed by Ansible
      eval "$(starship init {{ item }})"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - starship"
    create: true
    mode: '0644'
  loop: "{{ starship_shells }}"
  when: item in starship_shells

- name: Configure fish shell integration
  ansible.builtin.blockinfile:
    path: "{{ ansible_user_dir }}/.config/fish/config.fish"
    block: |
      # Starship prompt - Managed by Ansible
      starship init fish | source
    marker: "# {mark} ANSIBLE MANAGED BLOCK - starship"
    create: true
    mode: '0644'
  when: "'fish' in starship_shells"

- name: Verify Starship installation
  ansible.builtin.command:
    cmd: starship --version
  register: starship_version
  changed_when: false

- name: Display Starship version
  ansible.builtin.debug:
    msg: "Starship installed: {{ starship_version.stdout }}"

- name: Test Starship configuration
  ansible.builtin.command:
    cmd: starship explain
  register: starship_explain
  changed_when: false
  failed_when: starship_explain.rc != 0 and starship_explain.rc != 1
