---

- name: Complete Starship installation with configuration
  hosts: all
  become: yes
  vars:
    starship_config_dir: "{{ ansible_user_dir }}/.config"
    starship_config_file: "{{ starship_config_dir }}/starship.toml"

  tasks:
    - name: Install Starship via official script
      shell: |
        curl -sS https://starship.rs/install.sh | sh -s -- --yes
      args:
        executable: /bin/bash
      environment:
        STARSHIP_CACHE: "/tmp/starship-cache"

    - name: Create starship config directory
      file:
        path: "{{ starship_config_dir }}"
        state: directory
        mode: '0755'

    - name: Configure bash integration
      blockinfile:
        path: "{{ ansible_user_dir }}/.bashrc"
        block: |
          # Starship prompt
          eval "$(starship init bash)"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - starship"