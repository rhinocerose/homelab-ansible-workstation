---
- name: Install Rust dependencies
  ansible.builtin.package:
    name: "{{ rust_dependencies }}"
    state: present
  when: rust_install_dependencies | bool

- name: Check if Rust is already installed
  ansible.builtin.stat:
    path: "{{ rust_install_path }}/bin/rustc"
  register: rust_binary

- name: Check current Rust version
  ansible.builtin.command:
    cmd: "{{ rust_install_path }}/bin/rustc --version"
  register: rust_current_version
  changed_when: false
  failed_when: false
  when: rust_binary.stat.exists

- name: Download and install Rust
  when: not rust_binary.stat.exists or rust_update | bool
  block:
    - name: Download rustup installer
      ansible.builtin.get_url:
        url: https://sh.rustup.rs
        dest: /tmp/rustup.sh
        mode: '0755'
        timeout: 30
        validate_certs: true

    - name: Create Rust installation directory
      ansible.builtin.file:
        path: "{{ rust_install_path }}"
        state: directory
        mode: '0755'

    - name: Install Rust with rustup
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          export CARGO_HOME="{{ rust_install_path }}"
          export RUSTUP_HOME="{{ rust_install_path }}"
          /tmp/rustup.sh -y --default-toolchain {{ rust_channel }} --profile {{ rust_profile }}
        executable: /bin/bash
      environment:
        CARGO_HOME: "{{ rust_install_path }}"
        RUSTUP_HOME: "{{ rust_install_path }}"
      args:
        creates: "{{ rust_install_path }}/bin/rustc"

    - name: Clean up installer
      ansible.builtin.file:
        path: /tmp/rustup.sh
        state: absent

- name: Configure shell environment
  block:
    - name: Add Rust to PATH in bashrc
      ansible.builtin.lineinfile:
        path: "{{ ansible_user_dir }}/.bashrc"
        line: 'export PATH="{{ rust_install_path }}/bin:$PATH"'
        regex: '^export PATH=.*rustup.*bin'
        state: present
        create: true
        mode: '0644'

    - name: Ensure bash_profile sources bashrc
      ansible.builtin.lineinfile:
        path: "{{ ansible_user_dir }}/.bash_profile"
        line: '[ -f ~/.bashrc ] && source ~/.bashrc'
        state: present
        create: true
        mode: '0644'

    - name: Add Rust to current environment
      ansible.builtin.set_fact:
        rust_env_path: "{{ rust_install_path }}/bin"

- name: Check existing Rust targets
  ansible.builtin.command:
    cmd: "{{ rust_install_path }}/bin/rustup target list --installed"
  register: rust_existing_targets
  changed_when: false
  failed_when: false
  when: rust_binary.stat.exists and rust_targets | length > 0

- name: Install additional Rust targets
  ansible.builtin.command:
    cmd: "{{ rust_install_path }}/bin/rustup target add {{ item }}"
  environment:
    PATH: "{{ rust_env_path | default(rust_install_path + '/bin') }}:{{ ansible_env.PATH }}"
    CARGO_HOME: "{{ rust_install_path }}"
    RUSTUP_HOME: "{{ rust_install_path }}"
  loop: "{{ rust_targets }}"
  when:
    - rust_binary.stat.exists
    - rust_targets | length > 0
    - item not in rust_existing_targets.stdout
  changed_when: true

- name: Check existing Rust components
  ansible.builtin.command:
    cmd: "{{ rust_install_path }}/bin/rustup component list --installed"
  register: rust_existing_components
  changed_when: false
  failed_when: false
  when: rust_binary.stat.exists and rust_components | length > 0

- name: Install additional Rust components
  ansible.builtin.command:
    cmd: "{{ rust_install_path }}/bin/rustup component add {{ item }}"
  environment:
    PATH: "{{ rust_env_path | default(rust_install_path + '/bin') }}:{{ ansible_env.PATH }}"
    CARGO_HOME: "{{ rust_install_path }}"
    RUSTUP_HOME: "{{ rust_install_path }}"
  loop: "{{ rust_components }}"
  when:
    - rust_binary.stat.exists
    - rust_components | length > 0
    - item not in rust_existing_components.stdout
  changed_when: true

- name: Verify Rust installation
  ansible.builtin.command:
    cmd: "{{ rust_install_path }}/bin/rustc --version"
  register: rust_version
  changed_when: false

- name: Display Rust installation status
  ansible.builtin.debug:
    msg: "{{ 'Rust updated: ' if rust_update | bool else 'Rust installed: ' }}{{ rust_version.stdout }}"
  when: rust_version is success

- name: Verify Cargo installation
  ansible.builtin.command:
    cmd: "{{ rust_install_path }}/bin/cargo --version"
  register: rust_cargo_version
  changed_when: false

- name: Display Cargo installation status
  ansible.builtin.debug:
    msg: "{{ 'Cargo updated: ' if rust_update | bool else 'Cargo installed: ' }}{{ rust_cargo_version.stdout }}"
  when: rust_cargo_version is success

- name: Install "cargo-binutils" Rust package
  community.general.cargo:
    name: "{{ rust_cargo.packages }}"
    state: latest

- name: Install a Rust binary using cargo binstall
  ansible.builtin.command: "{{ ansible_env.HOME }}/.cargo/bin/cargo binstall -y probe-rs-tools"
  args:
    creates: "{{ ansible_env.HOME }}/.cargo/bin/probe-rs-tools" # Adjust creates to the actual binary name

- name: Add llvm-tools component
  ansible.builtin.command: rustup component add llvm-tools
  args:
    creates: "{{ ansible_env.HOME }}/.rustup/toolchains/{{ rustup_toolchain | default('stable') }}-{{ ansible_facts.target_triple }}/bin/llvm-objdump"
