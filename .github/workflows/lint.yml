name: Ansible Lint

on: [push, pull_request]

jobs:
  ansible-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Run ansible-lint
      uses: ansible/ansible-lint@main
      with:
        # Lint all files in the repository
        path: "."
        # Enable verbose output to see detailed errors
        options: "-v"
