---
- name: Workstation
  hosts: all
  become: true

  roles:
    - role: geerlingguy.docker
      when: ansible_architecture == "x86_64"
      tags:
        - docker
        - skip_ansible_lint

    - role: geerlingguy.docker_arm
      when: ansible_architecture == "aarch64"
      tags:
        - docker_arm
        - skip_ansible_lint

    - role: bash_tools
      tags:
        - base

    - role: rust
      tags:
        - rust

    - role: starship
      tags:
        - starship

    - role: pluggero.lazygit
